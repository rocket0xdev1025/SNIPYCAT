<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Sniper rifle cursor -->
  <g transform="rotate(-25 24 24)">
    <!-- Barrel -->
    <rect x="4" y="20" width="28" height="4" rx="1" fill="#1a1a1a" stroke="#0d3d0d" stroke-width="0.5"/>
    <!-- Muzzle -->
    <rect x="2" y="19.5" width="4" height="5" rx="0.5" fill="#2a2a2a"/>
    <!-- Scope body -->
    <rect x="14" y="14" width="12" height="6" rx="1" fill="#333" stroke="#1a5c1a" stroke-width="0.8"/>
    <!-- Scope lens -->
    <circle cx="26" cy="17" r="3.5" fill="#1a3a1a" stroke="#4ade80" stroke-width="1.2"/>
    <circle cx="26" cy="17" r="1.5" fill="#86efac" opacity="0.6"/>
    <!-- Scope mount -->
    <rect x="16" y="19.5" width="2" height="2" fill="#444"/>
    <rect x="22" y="19.5" width="2" height="2" fill="#444"/>
    <!-- Receiver -->
    <rect x="28" y="19" width="10" height="6" rx="1" fill="#222"/>
    <!-- Stock -->
    <path d="M38 19 L46 16 L46 28 L38 25 Z" fill="#3d2314" stroke="#2a1808" stroke-width="0.5"/>
    <!-- Trigger guard -->
    <path d="M32 25 Q32 30 36 30 L36 25" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Trigger -->
    <line x1="34" y1="25" x2="34" y2="28" stroke="#555" stroke-width="1.2"/>
    <!-- Mag -->
    <rect x="30" y="25" width="5" height="7" rx="0.5" fill="#1a1a1a"/>
  </g>
  <!-- Tiny green accent glow -->
  <circle cx="14" cy="18" r="1" fill="#4ade80" opacity="0.8"/>
</svg>
